name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Fix Structure & Build APK
        run: |
          mkdir -p app
          for f in *; do
            if [ "$f" != "app" ] && [ "$f" != ".github" ]; then
              mv "$f" app/
            fi
          done
          
          printf "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = \"MyAndroidApp\"\ninclude(':app')\n" > settings.gradle.kts

          printf "plugins {\n    id(\"com.android.application\") version \"8.1.2\" apply false\n    id(\"org.jetbrains.kotlin.android\") version \"1.9.0\" apply false\n}\n" > build.gradle.kts

          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
